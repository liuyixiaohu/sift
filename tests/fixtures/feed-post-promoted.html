<!--
  Feed-post fixture: a "Promoted" article — calibrated against live LinkedIn
  DOM (captured 2026-05).

  KEY REAL-WORLD STRUCTURE:

  1. <main> has NO `role="main"` (bare <main>).

  2. Posts are direct children of `<div role="list">` — the wrapper is a
     `<div role="list">`, NOT a `<ul>` or `<ol>`. feed.js#feedPosts queries
     `[role="list"]` for this reason.

  3. Posts wrap as `<div data-display-contents="true">` direct children of
     `[role="list"]`. feed.js#feedPosts uses `:scope > [data-display-contents]`
     to find them — direct-child match is what makes that query precise.

  4. Inside the outer [data-display-contents] there's a <div role="listitem">
     several divs deep, containing the actual post content + the leaf
     "Promoted" label.

  5. The "Promoted" label is a leaf <span> with EXACT text "Promoted".
     detectPostLabels walks all span/a/p leaves looking for POST_TYPE_LABELS.

  6. Follow button has aria-label STARTING WITH "Follow" (not exact match).
     The non-connection signal uses `button[aria-label*="Follow"]`.
-->
<!doctype html>
<html lang="en">
  <body>
    <main>
      <div role="list">
        <!-- Outer post wrapper — direct child of [role="list"] -->
        <div data-display-contents="true">
          <div>
            <div role="listitem">
              <div>
                <header>
                  <a href="/company/example"><span>Example Co.</span></a>
                  <p><span>Promoted</span></p>
                </header>
                <p>Sample promoted post body.</p>
                <button aria-label="Follow Example Co.">Follow</button>
                <!-- Control menu button — used by Unfollow injection -->
                <button aria-label="Open control menu for this post">…</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
