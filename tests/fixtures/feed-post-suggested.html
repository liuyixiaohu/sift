<!--
  Feed-post fixture: a "Suggested" article — same structural shape as the
  Promoted fixture but with a different leaf label.

  The "Suggested" label is a leaf <span> with EXACT text "Suggested" (not
  "Suggested for you" — that's the profile-widget heading, a different thing).
-->
<!doctype html>
<html lang="en">
  <body>
    <main>
      <div role="list">
        <div data-display-contents="true">
          <div>
            <div role="listitem">
              <div>
                <header>
                  <a href="/in/example"><span>Example User</span></a>
                  <p><span>Suggested</span></p>
                </header>
                <p>Sample suggested post body.</p>
                <button aria-label="Follow Example User">Follow</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
