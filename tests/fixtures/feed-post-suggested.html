<!--
  Feed-post fixture: a "Suggested" article — same structural shape as the
  Promoted fixture (2026-05-29 DOM): a direct-child `<div data-lazy-mount-id>`
  of `<div role="list">` containing a deep `[role="listitem"]`. NO
  `data-display-contents` — feed.js#feedPosts identifies posts by the presence
  of a `[role="listitem"]`.

  The "Suggested" label is a leaf <span> with EXACT text "Suggested" (not
  "Suggested for you" — that's the profile-widget heading, a different thing).
-->
<!doctype html>
<html lang="en">
  <body>
    <main>
      <div role="list">
        <div data-lazy-mount-id="a1b2c3d4">
          <div>
            <div role="listitem">
              <div>
                <header>
                  <a href="/in/example"><span>Example User</span></a>
                  <p><span>Suggested</span></p>
                </header>
                <p>Sample suggested post body.</p>
                <button aria-label="Follow Example User">Follow</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
