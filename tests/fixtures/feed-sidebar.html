<!--
  Feed-page (/feed/) right-sidebar fixture — calibrated against live LinkedIn
  DOM (captured 2026-05).

  KEY REAL-WORLD DETAILS:

  1. Two asides exist on the feed page: `aria-label="Sidebar"` (left/profile
     summary) and `aria-label="Aside"` (right rail, news/puzzles/ads). The
     widgets we want to mark live in "Aside", not "Sidebar".

  2. The widget headings are <p> leaves (not <h2>). This is the reason
     markProfileNoise's selector list includes <p> alongside <h1>-<h4>.

  3. "Today's puzzles" uses CURLY apostrophe U+2019. ASCII ' would not match.

  4. Real DOM has ~7 layers of nested <div> between the heading <p> and the
     aside. We include 4 here — enough for findNoiseWrapper's up-walk to
     exercise multiple iterations.

  5. No <section> wrappers around these widgets — bare <div> chains. This is
     what forces the up-walk in findNoiseWrapper (instead of just closest).
-->
<!doctype html>
<html lang="en">
  <body>
    <main>
      <div role="list">
        <div data-display-contents="true">
          <div>
            <div role="listitem">
              <p>Sample feed post body.</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <aside aria-label="Aside">
      <!-- Widget WITHOUT <section> wrapper — nested div chain (real DOM) -->
      <div>
        <div>
          <div>
            <div>
              <p>LinkedIn News</p>
              <ul>
                <li>Headline 1</li>
                <li>Headline 2</li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div>
          <div>
            <div>
              <!-- CURLY apostrophe U+2019 — LinkedIn uses this consistently -->
              <p>Today’s puzzles</p>
              <a href="/games/example">Play now</a>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div>
          <iframe title="advertisement" src="about:blank"></iframe>
        </div>
      </div>
    </aside>
  </body>
</html>
